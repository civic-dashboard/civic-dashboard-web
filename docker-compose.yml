services:
  database:
    image: postgres:17.2

    ports:
      - 54320:5432

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=civic_dashboard

    volumes:
      - ${PWD}/db-data/:/var/lib/postgresql/data/

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev:2.2.1

    ports:
      - 1080:1080
      - 1025:1025
