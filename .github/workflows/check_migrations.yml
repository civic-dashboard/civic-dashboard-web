name: Check migrations

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Check migrations
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54320/civic_dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.tool-versions'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start database
        run: npm run docker:start

      - name: Run migrations
        run: npm run db:run-migrations

      - name: Check migration rollback
        run: npx kysely migrate:rollback --all

      - name: Run migrations again
        run: npm run db:run-migrations

      - name: Generate types
        run: npm run db:update-types

      - name: Check that there is no diff
        run: git diff --exit-code

      - name: Dump docker logs
        if: always() # Ensure this runs if earlier steps fail
        run: docker compose logs database

      - name: Stop database
        run: npm run docker:stop
