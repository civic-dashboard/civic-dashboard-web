name: Classify Subject Terms

on:
  workflow_call:
    inputs:
      all_terms:
        description: 'Classify all subject terms, not only unclassified ones'
        type: boolean
        default: false
    secrets:
      DATABASE_URL:
        required: true
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true

permissions:
  contents: read

jobs:
  update-categories:
    runs-on: ubuntu-latest
    name: Update categories
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.tool-versions'
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ml/prod

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: ml/prod
        run: uv sync

      - name: Export subject terms
        run: |
          if [ "${{ inputs.all_terms }}" = "true" ]; then
            npm run tsx src/scripts/exportSubjectTerms.ts ml/run/subject_terms.txt -- --all
          else
            npm run tsx src/scripts/exportSubjectTerms.ts ml/run/subject_terms.txt
          fi

      - name: Count exported terms
        id: terms
        run: |
          count="$(grep -c . ml/run/subject_terms.txt || true)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Exported $count subject terms"

      - name: Classify subject terms
        if: steps.terms.outputs.count != '0'
        working-directory: ml/prod
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv run modal run app.py \
            --terms-file ../run/subject_terms.txt \
            --categories-file inputs/categories.json \
            --post-rules-file inputs/post-processing-rules.json \
            --output ../run/results.csv

      - name: Generate category mapping
        if: steps.terms.outputs.count != '0'
        run: |
          npm run tsx src/scripts/generateCategoryMapping.ts \
            ml/prod/inputs/categories.json \
            ml/run/results.csv \
            ml/run/category_mapping.json

      - name: Ingest classification results
        if: steps.terms.outputs.count != '0'
        run: |
          npm run tsx src/scripts/ingestClassificationResults.ts ml/run/category_mapping.json

      - name: Upload classification artifacts
        if: always() && steps.terms.outputs.count != '0'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: classification-results-${{ github.run_id }}
          path: ml/run/
          retention-days: 7
          if-no-files-found: ignore
