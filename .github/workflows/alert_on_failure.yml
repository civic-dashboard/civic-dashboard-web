name: Alert on workflow failure

# Posts to Slack when a critical workflow fails, so failures don't go unnoticed.
# Note: workflow_run only fires for this file as it exists on the default branch.
on:
  workflow_run:
    workflows:
      - Deploy web app
      - Update database
      - Notify subscribers
      - Refresh subscription queries
      - Repopulate raw contacts and votes
      - Update decision bodies
      - Migrate database
    types: [completed]

permissions:
  actions: read

jobs:
  alert:
    # Keep in sync with FAILED_CONCLUSIONS in the script below.
    if: ${{ contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    name: Alert on failure
    steps:
      - name: Post failure to Slack
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
        with:
          retries: 3
          script: |
            // Hourly workflows fail occasionally (TMMIS is flaky), so only alert
            // once they've failed THRESHOLD times in a row, then re-alert every
            // REALERT_EVERY consecutive failures (~daily) while still failing.
            const HOURLY_WORKFLOWS = ['Deploy web app', 'Update database'];
            const THRESHOLD = 3;
            const REALERT_EVERY = 24;
            const FAILED_CONCLUSIONS = ['failure', 'timed_out', 'startup_failure'];

            const STATUS_BY_CONCLUSION = {
              failure: '🚨 Failed',
              timed_out: '⏱️ Timed out',
              startup_failure: '🚫 Failed to start',
            };

            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const isHourly = HOURLY_WORKFLOWS.includes(run.name);

            // The hourly streak only tracks main; manual runs from other branches don't alert.
            if (isHourly && run.head_branch !== 'main') {
              core.info(`${run.name} failed on ${run.head_branch}, not main; skipping.`);
              return;
            }

            // Count consecutive failures on this run's branch ending at this run
            // (newest first). Cancelled/skipped runs neither extend nor break the streak.
            // A re-run keeps its original id and created_at, so its streak ends at
            // its original position. The created bound keeps the listing from
            // paging through the whole history before reaching this run.
            // failCount stays null if the lookup fails: an alert with unknown
            // streak details is better than no alert.
            let failCount = null;
            let firstFailure = null;
            try {
              let count = 0;
              let first = run;
              let reachedCurrentRun = false;
              outer: for await (const { data: runs } of github.paginate.iterator(
                github.rest.actions.listWorkflowRuns,
                {
                  owner, repo, workflow_id: run.workflow_id, branch: run.head_branch,
                  status: 'completed', created: `<=${run.created_at}`, per_page: 100,
                },
              )) {
                for (const r of runs) {
                  if (!reachedCurrentRun) {
                    if (r.id !== run.id) continue;
                    reachedCurrentRun = true;
                  }
                  if (FAILED_CONCLUSIONS.includes(r.conclusion)) {
                    count++;
                    first = r;
                  } else if (r.conclusion === 'success') {
                    break outer;
                  }
                }
              }
              failCount = Math.max(count, 1);
              firstFailure = first;
              core.info(`${run.name}: ${failCount} consecutive failure(s)`);
            } catch (error) {
              core.warning(`Could not count consecutive failures: ${error.message}`);
            }

            if (isHourly && failCount !== null) {
              const shouldAlert =
                failCount >= THRESHOLD && (failCount - THRESHOLD) % REALERT_EVERY === 0;
              if (!shouldAlert) {
                core.info('Below alert threshold or already alerted for this streak; skipping.');
                return;
              }
            }

            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            if (!webhookUrl) {
              core.setFailed('SLACK_WEBHOOK_ALERTS secret is not set.');
              return;
            }

            // A startup_failure run has no jobs, and a timed-out job may have no
            // step marked as failed, hence the fallbacks.
            let failedStep = 'unknown';
            try {
              const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, per_page: 100,
              });
              const failedJobs = jobs.filter((job) => FAILED_CONCLUSIONS.includes(job.conclusion));
              failedStep = 'none';
              if (failedJobs.length > 0) {
                const job = failedJobs[0];
                const step = (job.steps ?? []).find((s) => FAILED_CONCLUSIONS.includes(s.conclusion));
                failedStep = step ? `${job.name} › ${step.name}` : job.name;
                if (failedJobs.length > 1) failedStep += ` (+${failedJobs.length - 1} more failed jobs)`;
              }
            } catch (error) {
              core.warning(`Could not look up the failed step: ${error.message}`);
            }

            // Newer ICU versions put a narrow no-break space before AM/PM.
            const failingSince = firstFailure === null
              ? 'unknown'
              : new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Toronto',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                timeZoneName: 'short',
              })
                .format(new Date(firstFailure.run_started_at ?? firstFailure.created_at))
                .replace(/\u202f/g, ' ');

            const variables = {
              status: STATUS_BY_CONCLUSION[run.conclusion] ?? `🚨 ${run.conclusion}`,
              workflow: run.name,
              run_url: run.html_url,
              failed_step: failedStep,
              failing_since: failingSince,
              fail_count: failCount === null ? 'unknown' : String(failCount),
              commit_sha: run.head_sha.slice(0, 7),
              commit_message: run.head_commit?.message.split('\n')[0] ?? 'none',
              commit_author: run.head_commit?.author?.name ?? 'none',
              trigger: run.event,
              branch: run.head_branch,
              actor: run.event === 'schedule'
                ? 'GitHub'
                : (run.triggering_actor ?? run.actor)?.login ?? 'none',
            };

            // `message` keeps the old single-variable Slack template working until
            // it is replaced with one built from the variables above.
            const streakNote = failCount > 1 ? ` (${failCount} failures in a row)` : '';
            const message =
              `${variables.status}: ${variables.workflow}${streakNote}\n` +
              `Branch: ${variables.branch} · Trigger: ${variables.trigger}\n` +
              `${variables.run_url}`;

            const res = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...variables, message }),
            });
            if (!res.ok) {
              core.setFailed(`Slack webhook returned ${res.status}: ${await res.text()}`);
            }
