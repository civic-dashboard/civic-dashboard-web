services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file: ../.env.sample
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/civic_dashboard
    volumes:
      - ..:/workspaces/civic-dashboard-web:cached
      - ../.env.sample:/workspaces/civic-dashboard-web/.env:ro
      - npm-cache:/home/node/.npm
      - node-modules:/workspaces/civic-dashboard-web/node_modules
    ports:
      - '127.0.0.1:3000:3000'
    command: >-
      sh -c 'cd /workspaces/civic-dashboard-web &&
      until test -f /tmp/civic-dashboard-devcontainer-ready; do sleep 1; done &&
      exec npm run dev -- --hostname 0.0.0.0'
    user: node
    depends_on:
      database:
        condition: service_healthy

  database:
    volumes:
      - ../db-data/:/var/lib/postgresql/data/

volumes:
  npm-cache:
  node-modules:
